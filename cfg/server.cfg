// -> Ads
sm_advertisements_enabled 1
sm_advertisements_interval 480

//->  Log Settings
sv_logfile 1
sv_logbans 1
sv_logecho 1
sv_log_onefile 0

//-> Rate Settings
sv_minrate 20000
sv_maxrate 30000

//-> Disable Friendly Fire
sm_cvar survivor_friendly_fire_factor_easy 0
sm_cvar survivor_friendly_fire_factor_expert 0
sm_cvar survivor_friendly_fire_factor_hard 0
sm_cvar survivor_friendly_fire_factor_normal 0

//-> 8 Player Lobby
//maxplayers 16
sm_cvar sv_maxplayers 16  // Sets the maximum number of players to 16
sm_cvar "survivor_limit" 16  // Limits the number of survivors to 16
sm_cvar sv_visiblemaxplayers "-1"  // Keeps the maximum visible players as unlimited (-1)
sm_cvar sv_allow_lobby_connect_only "0"  // Allows players to connect without needing to go through the lobby

sm_cvar sv_force_unreserved "1"  // Forces the server to stay unreserved, meaning it won't lock after the first 4 slots are filled
sm_l4dd_unreserve  // Unreserves the server to allow more than 4 players
sm_unreserve  // Unreserves the server to allow more players to join


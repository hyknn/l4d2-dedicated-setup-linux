// Logging
log on                                   //Creates a logfile (on | off)
sv_logecho 0                             //default 1; Echo log information to the console.
sv_logfile 1                             //default 1; Log server information in the log file.
sv_log_onefile 0                         //default 0; Log server information to only one file.
sv_logbans 1                             //default 0; Log server bans in the server logs.
sv_logflush 0                            //default 0; Flush the log files to disk on each write (slow).
sv_logsdir logs                          //Folder in the game directory where server logs will be stored.

// Rate Settings
sv_minrate 20000
sv_maxrate 30000

// Disable Friendly Fire
sm_cvar survivor_friendly_fire_factor_easy 0
sm_cvar survivor_friendly_fire_factor_expert 0
sm_cvar survivor_friendly_fire_factor_hard 0
sm_cvar survivor_friendly_fire_factor_normal 0

// Max players
sm_cvar survivor_limit 8
sm_cvar z_max_player_zombies 10
sv_maxplayers 8
sv_visiblemaxplayers 8
sv_unlock_sb_add 1

// Super Versus
l4d_survivor_limit 8
l4d_infected_limit 8

// Unreserve
sv_removehumanlimit 1
sv_allow_lobby_connect_only 0
sv_force_unreserved 1
sm_l4dd_unreserve
sm_unreserve

// Mod
sm_keeplasers_mode 2

// Load 100 tickrate
exec server_rates.cfg


version: "3.0"

services:
  l4d2:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - HOSTNAME=${HOSTNAME}
      - REGION=4
      - STEAM_GROUP=${STEAMGROUP}
      - DEFAULT_MAP=c1m1_hotel
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
    volumes:
      - ./addons:/addons
      # Server Config
      - ./cfg/server.cfg:/cfg/server.cfg
      # ABM
      - ./cfg/sourcemod/abm.cfg:/cfg/sourcemod/abm.cfg
    #network_mode: host

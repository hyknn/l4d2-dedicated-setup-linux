services:
  l4d2:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - HOSTNAME=${HOSTNAME}
      - REGION=4
      - STEAM_GROUP=${STEAMGROUP}
      - STEAM_GROUP_EXCLUSIVE=${EXCLUSIVE}
      - EXTRA_ARGS="-debug"
      - DEFAULT_MAP=c1m1_hotel
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
    volumes:
      - ./addons:/addons
      - ./logs:/home/louis/l4d2/left4dead2/logs
      # Sourcemod
      - ./cfg/sourcemod/sourcemod.cfg:/cfg/sourcemod/sourcemod.cfg
      # Multislots
      - ./cfg/sourcemod/l4dmultislots.cfg:/cfg/sourcemod/l4dmultislots.cfg
      # Server Config
      - ./cfg/server.cfg:/cfg/server.cfg
      - ./cfg/server_rates.cfg:/cfg/server_rates.cfg

networks:
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
